name: Publicar release

# Se dispara al enviar una etiqueta v* (p. ej. v1.11.0):
#     git tag -a v1.11.0 -m "Notas de la versión..."
#     git push origin v1.11.0
#
# Construye el AppImage y el paquete de código, genera latest.json y publica todo
# como una release de GitHub. La aplicación instalada lo detecta y se actualiza sola.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1 libcups2

      - name: Comprobar que la etiqueta coincide con la versión del código
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          COD=$(python -c "import taller; print(taller.__version__)")
          echo "Etiqueta: $TAG   Código: $COD"
          test "$TAG" = "$COD" || { echo "::error::La etiqueta v$TAG no coincide con taller.__version__ ($COD)"; exit 1; }

      - name: Notas de la versión (mensaje de la etiqueta anotada)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Se lee por la API para no depender de cómo checkout deja la etiqueta local.
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                       -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          REF=$(api "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")
          SHA=$(printf '%s' "$REF" | jq -r '.object.sha')
          TYPE=$(printf '%s' "$REF" | jq -r '.object.type')
          if [ "$TYPE" = "tag" ]; then
            api "https://api.github.com/repos/$REPO/git/tags/$SHA" | jq -r '.message' > NOTAS.txt
          else
            api "https://api.github.com/repos/$REPO/commits/$SHA" | jq -r '.commit.message' > NOTAS.txt
          fi
          # quita trailers y líneas en blanco sobrantes al final
          sed -i -E '/^(Co-authored-by|Signed-off-by):/Id' NOTAS.txt
          sed -i -e :a -e '/^[[:space:]]*$/{$d;N;ba}' NOTAS.txt
          [ -s NOTAS.txt ] || printf 'Versión %s\n' "$TAG" > NOTAS.txt
          echo "----- NOTAS.txt -----"; cat NOTAS.txt

      - name: Paquete de código
        run: bash make_dist.sh

      - name: AppImage
        run: bash build_appimage.sh

      - name: Generar latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/generar_latest_json.py \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --appimage dist/Taller-de-Coches-x86_64.AppImage \
            --fuente "dist/taller-coches-${VERSION}.tar.gz" \
            --notas-file NOTAS.txt \
            --salida dist/latest.json

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTAS.txt
          files: |
            dist/Taller-de-Coches-x86_64.AppImage
            dist/taller-coches-*.tar.gz
            dist/latest.json
